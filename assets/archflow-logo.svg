<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">ArchFlow</title>
  <desc id="desc">ArchFlow logo: connected architecture nodes forming an A beside the ArchFlow wordmark.</desc>
  <defs>
    <linearGradient id="archflow-gradient" x1="18" y1="18" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="archflow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#00FF9D" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="720" height="180" fill="#F8FAFC"/>

  <!-- Mark: an architectural A built from connected nodes and flow lines. -->
  <g filter="url(#archflow-shadow)">
    <rect x="10" y="10" width="160" height="160" rx="36" fill="#0B1115"/>
    <path d="M48 137 90 43l42 94M65 101h50" fill="none" stroke="url(#archflow-gradient)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 43v29M48 137h-9M132 137h9" fill="none" stroke="#A7F3D0" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <circle cx="90" cy="43" r="11" fill="#0B1115" stroke="#00FF9D" stroke-width="6"/>
    <circle cx="48" cy="137" r="9" fill="#0B1115" stroke="#22D3EE" stroke-width="5"/>
    <circle cx="132" cy="137" r="9" fill="#0B1115" stroke="#22D3EE" stroke-width="5"/>
    <circle cx="65" cy="101" r="7" fill="#00FF9D"/>
    <circle cx="115" cy="101" r="7" fill="#22D3EE"/>
  </g>

  <!-- Wordmark uses a system font so the asset stays dependency-free. -->
  <text x="205" y="116" fill="#102027" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Arch<tspan fill="#7C3AED">Flow</tspan></text>
</svg>
